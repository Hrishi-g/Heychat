name: Build and Release Flutter App

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0, v1.0.1

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore .env file from Secrets
        run: |
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Optimized Android APK
        run: |
          flutter build apk --release \
            --dart-define-from-file=.env \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Prepare APKs for release
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/HeyChat-arm64-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/HeyChat-armeabi-${{ github.ref_name }}.apk

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}